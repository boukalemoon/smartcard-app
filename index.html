    <!-- Kanonik adres: aynı dağıtım üç alan adından da açılıyor
         (www.qrtim.com.tr, qrtim.com.tr, qartim.com). Canonical olmadan
         arama motoru bunları ayrı siteler sayıp sıralama gücünü bölüyordu.
         Gezinirken sayfa başına güncellenir (src/components/SayfaMeta.jsx). -->
    <link rel="canonical" href="https://www.qrtim.com.tr/" />

    <!-- Paylaşım kartı. Ürünün tamamı bağlantı paylaşmaya dayanıyor ama
         paylaşılan bağlantının önizlemesi yoktu: WhatsApp'ta, LinkedIn'de
         çıplak adres görünüyordu. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="QRtım" />
    <meta property="og:locale" content="tr_TR" />
    <meta property="og:url" content="https://www.qrtim.com.tr/" />
    <meta property="og:title" content="QRtım — Dijital Kimlik ve Kartvizit Platformu" />
